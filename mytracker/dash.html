function lmiRun_(ok, bad) {
  function call(api, t) {
    fetch(LMI_API + '?api=' + api + '&tok=' + encodeURIComponent(t || ''), { credentials: 'omit', redirect: 'follow' })
      .then(function (r) { return r.json(); })

<script>

function inr(v,full){if(v===''||v===null||v===undefined||isNaN(v))return '—';var n=Number(v),a=Math.abs(n),s=n<0?'-':'';
  if(!full&&a>=1e7)return s+'₹'+(a/1e7).toFixed(2)+' Cr'; if(!full&&a>=1e5)return s+'₹'+(a/1e5).toFixed(2)+' L';

function num(v){return (v===''||v==null||isNaN(v))?'—':Math.round(Number(v)).toLocaleString('en-IN');}
function pct(v){return (v===''||v==null||isNaN(v))?'—':(Number(v)*100).toFixed(1)+'%';}
var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dt(s,day){s=String(s||'');if(!/^\d{4}-\d\d/.test(s))return esc(s);var m=MN[+s.slice(5,7)-1];return (day&&s.length>=10?(+s.slice(8,10))+' ':'')+m+"'"+s.slice(2,4);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function ci(t,h){var i=t.head.indexOf(h);if(i<0)console.warn('missing column',h);return i;}
function nz(v){return (v===''||v==null||isNaN(v))?0:Number(v);}

// ── period machinery
function keyOf(t,row){var h=TYPES[TYPE];var i=t.head.indexOf(h);return i>=0?row[i]:null;}
function periods(){var seen=[];D.proj.rows.forEach(function(r){var k=keyOf(D.proj,r);if(seen.indexOf(k)<0)seen.push(k);});return seen;}
function rowsIn(t,p){return t.rows.filter(function(r){return keyOf(t,r)===p;});}
function agg(t,rows,h,mode){var i=ci(t,h);if(i<0)return '';mode=mode||aggMode(t,h);
  var v=rows.map(function(r){return r[i];}).filter(function(x){return x!==''&&x!=null&&!isNaN(x);}).map(Number);
  if(!v.length)return '';
  if(mode==='last')return v[v.length-1]; if(mode==='first')return v[0];
  if(mode==='avg')return v.reduce(function(a,b){return a+b;},0)/v.length;
  return v.reduce(function(a,b){return a+b;},0);}
function aggMode(t,h){if(t===D.proj){var m=D.proj.agg[D.proj.head.indexOf(h)];if(m&&m.indexOf('ratio')===0)return 'avg';return m||'sum';}

var SHEET=false,SKIP=0;

    var src=th.querySelectorAll('th'),dst=c.querySelectorAll('th');for(var i=0;i<src.length&&i<dst.length;i++){var w=src[i].getBoundingClientRect().width+'px';dst[i].style.width=dst[i].style.minWidth=dst[i].style.maxWidth=w;}

var ICON={overview:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',pnl:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',

// ── listings drill-down: PIN → customers → invoices (from Zoho invoices)
function pdate(s){s=String(s||'');if(/^\d{4}-\d\d-\d\d/.test(s))return s.slice(0,10);
  var m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[-\/ ](\d{2,4})$/);if(m){var mi=MN.indexOf(m[2].charAt(0).toUpperCase()+m[2].slice(1,3).toLowerCase());
    var y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+('0'+(mi+1)).slice(-2)+'-'+('0'+m[1]).slice(-2);}
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return m[3]+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2);return s;}
function LST(){if(LST.c)return LST.c;
  var byInv={},custs={};
  (D.inv||[]).forEach(function(r){if(/void|draft/i.test(r.status))return;var k=r.no;
    var i=byInv[k]||(byInv[k]={no:r.no,date:pdate(r.date),cust:String(r.cust||''),status:r.status,lines:[],amt:0,tax:0,pin:''});
    i.lines.push(r);i.amt+=nz(r.amt);i.tax+=nz(r.tax);if(r.pin&&!i.pin)i.pin=r.pin;});
  Object.keys(byInv).forEach(function(k){var i=byInv[k];var c=custs[i.cust]||(custs[i.cust]={name:i.cust,invs:[],pins:{},first:'',last:'',total:0,lt:0,listing:false});
    c.invs.push(i);c.total+=i.amt+i.tax;
    i.lines.forEach(function(l){if(/Listing Subscription|Setup Fee/.test(l.stream)){c.listing=true;c.lt+=nz(l.amt)+nz(l.tax);if(l.pin)c.pins[l.pin]=(c.pins[l.pin]||0)+1;
      if(!c.first||i.date<c.first)c.first=i.date;if(!c.last||i.date>c.last)c.last=i.date;}});});
  var list=Object.keys(custs).map(function(k){return custs[k];}).filter(function(c){return c.listing&&!/^list my india/i.test(c.name);});
  var pins={};
  list.forEach(function(c){c.pin=Object.keys(c.pins).sort(function(a,b){return c.pins[b]-c.pins[a];})[0]||'No PIN tag';

  setTimeout(ldDraw,0);return h;}
function ldDraw(){var el=document.getElementById('ldlist');if(!el)return;var rows=ldFilter();
  if(!rows.length){el.innerHTML='<div class="card" style="text-align:center;color:var(--mute)">No leads match.</div>';return;}
  if(window.innerWidth>=760){el.innerHTML=ldTable(rows);return;}
  el.innerHTML=rows.map(function(r){var meta=[ldv(r,'Current City'),ldv(r,'Lead generated through'),ldv(r,'May be Suited for (our thought)')].filter(String).map(esc).join(' · ');
    var up=ldv(r,'Latest Update'),f=ldv(r,'Next follow-up');
    return '<div class="ld" onclick="ldEdit('+r[0]+')"><div class="ldh"><b>'+esc(ldv(r,'Name'))+'</b>'+ldStageChip(ldv(r,'Stage'))+'</div>'+
      (meta?'<div class="ldm">'+meta+'</div>':'')+(up?'<div class="ldu">'+esc(up)+'</div>':'')+
      '<div class="ldf">'+(f?'<span class="'+(ldDue(r)?'bad':'')+'">⏰ '+esc(ldDate(f))+'</span>':'<span>No follow-up set</span>')+'<span>'+esc(ldAgo(r[ldi('Last updated')]))+' <i class="lk">Edit ›</i></span></div></div>';}).join('');}
function ldCtl(h,val,row,inline){var o=D.leads.opts[h],id='f_'+ldi(h)+(inline?'_'+row:'');
  var on=inline?' onchange="ldCell(this,'+row+',\''+h.replace(/'/g,"\\'")+'\')"':'';
  if(h==='Next follow-up')return '<input type="date" id="'+id+'" value="'+esc(val)+'"'+on+'>';
  if(h==='Latest Update')return inline?'<input id="'+id+'" value="'+esc(val)+'"'+on.replace('onchange','onchange')+' placeholder="Add update…">':'<textarea id="'+id+'" rows="3" placeholder="What happened? Next step?">'+esc(val)+'</textarea>';
  if(h==='Name')return '<input id="'+id+'" value="'+esc(val)+'"'+on+' placeholder="Full name">';
  var opts=(o||[]).slice();if(val&&opts.indexOf(val)<0)opts.unshift(val);
  return '<select id="'+id+'" data-h="'+esc(h)+'"'+(inline?on:' onchange="ldNew(this)"')+'><option value="">—</option>'+opts.map(function(x){return '<option'+(x===val?' selected':'')+'>'+esc(x)+'</option>';}).join('')+'<option value="__new">＋ New…</option></select>';}
var LD_FORM=['Name','Stage','Next follow-up','Latest Update','Current City','Exploring for','Lead generated through','Lead generated by','May be Suited for (our thought)','Their Thought','Call','Presentation'];
function ldEdit(row){var r=row?D.leads.rows.filter(function(x){return x[0]===row;})[0]:null;var P=document.getElementById('le');
  P.querySelector('.drp').innerHTML='<div class="drh"><b>'+(r?esc(ldv(r,'Name')):'New lead')+'</b><button onclick="ldClose()" aria-label="Close">✕</button></div>'+
    '<div class="lform">'+LD_FORM.map(function(h){return '<label class="'+(h==='Latest Update'||h==='Name'?'full':'')+'"><span>'+esc(LD_SHORT[h]||h)+'</span>'+ldCtl(h,r?ldv(r,h):(h==='Stage'?'New':''),row,false)+'</label>';}).join('')+'</div>'+
    (r?'<div class="note">Last updated '+esc(ldAgo(r[ldi('Last updated')])||'—')+(ldv(r,'Updated by')?' by '+esc(ldv(r,'Updated by')):'')+' · Sheet row '+row+'</div>':'')+
    '<div class="lact"><button class="ldsec" onclick="ldClose()">Cancel</button><button class="ldadd" id="ldsave" onclick="ldSubmit('+row+')">Save</button></div>';
  P.classList.add('on');sheetOn();P.querySelector('.drp').scrollTop=0;}
function ldClose(){document.getElementById('le').classList.remove('on');sheetOff();}
function ldNew(sel){if(sel.value!=='__new')return;var inp=document.createElement('input');inp.id=sel.id;inp.placeholder='Type new '+(LD_SHORT[sel.dataset.h]||sel.dataset.h).toLowerCase();sel.parentNode.replaceChild(inp,sel);inp.focus();}
function ldSubmit(row){var v={};LD_FORM.forEach(function(h){var e=document.getElementById('f_'+ldi(h));if(e)v[h]=e.value==='__new'?'':e.value;});
  if(!String(v.Name||'').trim()){ldToast('Please enter a name',1);return;}
  var b=document.getElementById('ldsave');b.disabled=true;b.textContent='Saving…';
  ldPost(row,v,function(){ldClose();render();ldToast(row?'Saved ✓':'Lead added ✓');},function(m){b.disabled=false;b.textContent='Save';ldToast(m,1);});}
function ldTable(rows){var H=['Name','Stage','Next follow-up','Latest Update','Current City','Exploring for','Lead generated through','Lead generated by','May be Suited for (our thought)','Their Thought','Call','Presentation'];
  return '<div class="tbl ldt"><table><thead><tr><th>#</th>'+H.map(function(h){return '<th>'+esc(LD_SHORT[h]||h)+'</th>';}).join('')+'</tr></thead><tbody>'+
    rows.map(function(r){return '<tr'+(ldDue(r)?' class="due"':'')+'><td><a class="lk" onclick="ldEdit('+r[0]+')" title="Open full form">'+esc(String(r[1]||''))+'</a></td>'+H.map(function(h){return '<td class="c_'+ldi(h)+'">'+ldCtl(h,ldv(r,h),r[0],true)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>';}
function ldCell(el,row,h){if(el.value==='__new'){var t=prompt('New value for '+(LD_SHORT[h]||h)+':');if(!t){el.value='';return;}var o=document.createElement('option');o.textContent=t;el.insertBefore(o,el.lastChild);el.value=t;}
  if(h==='Name'&&!el.value.trim()){ldToast('Name cannot be empty',1);return;}
  var v={};v[h]=el.value;el.classList.add('saving');
  ldPost(row,v,function(){el.classList.remove('saving');el.classList.add('saved');setTimeout(function(){el.classList.remove('saved');},1500);ldToast('Saved ✓');},function(m){el.classList.remove('saving');el.classList.add('err');ldToast(m,1);});}
function ldPost(row,v,ok,bad){fetch(LMI_API+'?api=leadSave&tok='+encodeURIComponent(TOK)+'&d='+encodeURIComponent(JSON.stringify({r:row,v:v})),{credentials:'omit',redirect:'follow'})
  .then(function(r){return r.json();}).then(function(o){if(!o.ok)throw new Error(o.error);D.leads=JSON.parse(o.r).leads;ok();})
  .catch(function(e){bad(String(e&&e.message||'Network problem — please try again'));});}
function ldToast(m,err){var t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.textContent=m;t.className=err?'on err':'on';clearTimeout(t._h);t._h=setTimeout(function(){t.className='';},2200);}
window.addEventListener('resize',function(){if(TAB==='leads'&&!document.querySelector('.dr.on'))ldDraw();});
var USW=window.innerWidth>=760;window.addEventListener('resize',function(){var w=window.innerWidth>=760;if(w!==USW){USW=w;if(TAB==='users')usDraw();}});

// ── data
var TOK = (location.hash.match(/tok=([^&]+)/) || [])[1]; TOK = TOK ? decodeURIComponent(TOK) : '';
var EM = (location.hash.match(/em=([^&]+)/) || [])[1]; EM = EM ? decodeURIComponent(EM) : '';
if (EM) { var w = document.getElementById('who'); w.innerHTML = '<i></i><span></span>'; w.querySelector('i').textContent = EM.charAt(0).toUpperCase(); w.querySelector('span').textContent = EM; w.title = 'Signed in as ' + EM; }
if (!TOK) { window.top.location.href = 'https://listmyindia.org/mytracker/'; }
try { history.replaceState(null, '', location.pathname); } catch (e) {}
function load(){document.getElementById('load').style.display='block';
  google.script.run.withSuccessHandler(function(s){D=JSON.parse(s);LST.c=null;document.getElementById('load').style.display='none';
    if(!PERIOD)PERIOD=curPeriod();
    var sy=D.sync;document.getElementById('syncTxt').textContent=sy?('Zoho sync: '+dt(sy[0],1)+' · '+sy[1]):'Not synced yet';
    document.getElementById('syncBtn').style.display=D.owner?'inline-block':'none';
    buildShell();render();})
  .withFailureHandler(function(e){var l=document.getElementById('load');
    if(/sign in again|not authorised/i.test(e.message)){l.innerHTML='Your sign-in has expired (Google sign-ins last about an hour).<br><br><button class="btn" onclick="lmiAuth(\'out\')">Sign in again</button>';}
    else l.textContent='Could not load: '+e.message;}).getData(TOK);}
document.getElementById('syncBtn').onclick=function(){var b=this;b.disabled=true;b.textContent='Syncing…';
  google.script.run.withSuccessHandler(function(m){b.disabled=false;b.textContent='Sync now';load();})
  .withFailureHandler(function(e){b.disabled=false;b.textContent='Sync now';alert('Sync failed: '+e.message);}).syncFromWeb(TOK);};
// ── Log out: back to the sign-in screen (clears the saved sign-in)
function lmiAuth(k){var a=document.createElement('a');a.href='https://listmyindia.org/mytracker/?logout=1';a.target='_top';a.rel='noopener';
  document.body.appendChild(a);a.click();a.remove();}
load();
</script>
