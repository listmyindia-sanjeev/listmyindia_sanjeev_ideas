function lmiRun_(ok, bad) {

    fetch(LMI_API + '?api=' + api + '&tok=' + encodeURIComponent(t || ''), { credentials: 'omit', redirect: 'follow' })

<script>

function inr(v,full){if(v===''||v===null||v===undefined||isNaN(v))return '—';var n=Number(v),a=Math.abs(n),s=n<0?'-':'';
  if(!full&&a>=1e7)return s+'₹'+(a/1e7).toFixed(2)+' Cr'; if(!full&&a>=1e5)return s+'₹'+(a/1e5).toFixed(2)+' L';
  return s+'₹'+Math.round(a).toLocaleString('en-IN');}
function num(v){return (v===''||v==null||isNaN(v))?'—':Math.round(Number(v)).toLocaleString('en-IN');}
function pct(v){return (v===''||v==null||isNaN(v))?'—':(Number(v)*100).toFixed(1)+'%';}
var MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function dt(s,day){s=String(s||'');if(!/^\d{4}-\d\d/.test(s))return esc(s);var m=MN[+s.slice(5,7)-1];return (day&&s.length>=10?(+s.slice(8,10))+' ':'')+m+"'"+s.slice(2,4);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function ci(t,h){var i=t.head.indexOf(h);if(i<0)console.warn('missing column',h);return i;}
function nz(v){return (v===''||v==null||isNaN(v))?0:Number(v);}

// ── period machinery
function keyOf(t,row){var h=TYPES[TYPE];var i=t.head.indexOf(h);return i>=0?row[i]:null;}
function periods(){var seen=[];D.proj.rows.forEach(function(r){var k=keyOf(D.proj,r);if(seen.indexOf(k)<0)seen.push(k);});return seen;}
function rowsIn(t,p){return t.rows.filter(function(r){return keyOf(t,r)===p;});}
function agg(t,rows,h,mode){var i=ci(t,h);if(i<0)return '';mode=mode||aggMode(t,h);
  var v=rows.map(function(r){return r[i];}).filter(function(x){return x!==''&&x!=null&&!isNaN(x);}).map(Number);
  if(!v.length)return '';
  if(mode==='last')return v[v.length-1]; if(mode==='first')return v[0];
  if(mode==='avg')return v.reduce(function(a,b){return a+b;},0)/v.length;
  return v.reduce(function(a,b){return a+b;},0);}
function aggMode(t,h){if(t===D.proj){var m=D.proj.agg[D.proj.head.indexOf(h)];if(m&&m.indexOf('ratio')===0)return 'avg';return m||'sum';}

var NAV=[];

var SHEET=false,SKIP=0;

  return h+'</tbody></table></div>';}
// ── listings drill-down: PIN → customers → invoices (from Zoho invoices)
function pdate(s){s=String(s||'');if(/^\d{4}-\d\d-\d\d/.test(s))return s.slice(0,10);
  var m=s.match(/^(\d{1,2})[-\/ ]([A-Za-z]{3})[-\/ ](\d{2,4})$/);if(m){var mi=MN.indexOf(m[2].charAt(0).toUpperCase()+m[2].slice(1,3).toLowerCase());
    var y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+('0'+(mi+1)).slice(-2)+'-'+('0'+m[1]).slice(-2);}
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return m[3]+'-'+('0'+m[1]).slice(-2)+'-'+('0'+m[2]).slice(-2);return s;}
function LST(){if(LST.c)return LST.c;
  var byInv={},custs={};
  (D.inv||[]).forEach(function(r){if(/void|draft/i.test(r.status))return;var k=r.no;
    var i=byInv[k]||(byInv[k]={no:r.no,date:pdate(r.date),cust:String(r.cust||''),status:r.status,lines:[],amt:0,tax:0,pin:''});
    i.lines.push(r);i.amt+=nz(r.amt);i.tax+=nz(r.tax);if(r.pin&&!i.pin)i.pin=r.pin;});
  Object.keys(byInv).forEach(function(k){var i=byInv[k];var c=custs[i.cust]||(custs[i.cust]={name:i.cust,invs:[],pins:{},first:'',last:'',total:0,lt:0,listing:false});
    c.invs.push(i);c.total+=i.amt+i.tax;
    i.lines.forEach(function(l){if(/Listing Subscription|Setup Fee/.test(l.stream)){c.listing=true;c.lt+=nz(l.amt)+nz(l.tax);if(l.pin)c.pins[l.pin]=(c.pins[l.pin]||0)+1;
      if(!c.first||i.date<c.first)c.first=i.date;if(!c.last||i.date>c.last)c.last=i.date;}});});
  var list=Object.keys(custs).map(function(k){return custs[k];}).filter(function(c){return c.listing&&!/^list my india/i.test(c.name);});
  var pins={};
  list.forEach(function(c){c.pin=Object.keys(c.pins).sort(function(a,b){return c.pins[b]-c.pins[a];})[0]||'No PIN tag';

  var pl=Object.keys(pins).map(function(k){return pins[k];}).sort(function(a,b){return b.custs.length-a.custs.length||(a.pin<b.pin?-1:1);});

var US={q:'',sort:'points',dir:-1,pin:'',lst:'',pts:'',ct:'',jn:'',act:'',lim:60};

var LF={q:'',st:'All',due:false};

function ldDate(f){var p=String(f).split('-');var M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return p.length===3?(+p[2])+' '+M[+p[1]-1]+(p[0]!==String(new Date().getFullYear())?' '+p[0]:''):f;}
