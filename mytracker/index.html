<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Founder Tracker · List My India™</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{--blue:#0046BF;--navy:#05132D;--yel:#FEEF22}
  html,body{margin:0;height:100%;font-family:Poppins,system-ui,sans-serif}
  body{background:radial-gradient(circle at 50% 35%,#1d4fae 0%,var(--navy) 75%)}
  #gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  .card{width:100%;max-width:380px;text-align:center;background:#fff;border-radius:18px;padding:32px 24px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  h1{font-size:20px;margin:0 0 4px;color:var(--navy)}h1 span{color:var(--blue)}
  p{font-size:14px;color:#556;line-height:1.5;margin:0 0 20px}
  #gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:24px;
        padding:9px 14px 9px 12px;font:600 14px Poppins,system-ui,sans-serif;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  #gbtn:hover{background:#f7f9fc;border-color:#c6d4f0}
  #gbtn svg{flex:none}
  #gbtn .arw{margin-left:4px;padding-left:10px;border-left:1px solid #e3e3e3;color:#5f6368;font-size:12px}
  .hint{font-size:12px;color:#889;margin-top:8px}
  #err{display:none;margin-top:16px;background:#FFF3F3;border:1px solid #F3C1C1;border-radius:10px;padding:12px;text-align:left}
  #err b{display:block;color:#C62828;font-size:14px;margin-bottom:4px}
  #err span{font-size:13px;color:#6b3a3a;line-height:1.45}
  .lock{font-size:12px;color:#889;margin-top:18px}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#f4f6fb}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <h1>List My India<span>™</span> Founder Tracker</h1>
    <p>Sign in with your approved Google account to open the dashboard.</p>
    <button id="gbtn" type="button" aria-haspopup="listbox" title="Choose a Google account">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.5 0 20.1 0 24s1 7.5 2.7 10.7l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
      <span>Sign in with Google</span><span class="arw">▾</span>
    </button>
    <div class="hint">Pick any of your Google accounts from the list</div>
    <div id="err"></div>
    <div class="lock">🔒 Approved founders only · data stays in Google</div>
  </div>
</div>
<iframe id="app" title="LMI Founder Tracker" allow="clipboard-write"></iframe>
<script>
  // Google sign-in client (Google Cloud project "LMI Tracker Sign-in", listmyindia@gmail.com) — allowed only on https://listmyindia.org
  var CLIENT_ID = "292504984896-gf0a1gck80o9bb91qleed9sao9s9u1pb.apps.googleusercontent.com";
  // Apps Script web-app URL (Deploy → Manage deployments → Web app URL)
  var TRACKER_URL = "https://script.google.com/macros/s/AKfycbzjXC80_FN2QAxQYtctQ2-pjDMoZ80_kZzorRVddG7HH8ZISQjhayIM3CflAX96zr52/exec";
  // Who may pass this screen (the dashboard re-checks the Google token and its own allow-list on every request)
  var ALLOWED = ["listmyindia@gmail.com", "smile.sanjeev@gmail.com", "listmyindia.tech@gmail.com"];
  var client = null;

  function showErr(title, msg) {
    var box = document.getElementById('err');
    box.innerHTML = '<b></b><span></span>';
    box.querySelector('b').textContent = title;
    box.querySelector('span').textContent = msg;
    box.style.display = 'block';
  }
  function onToken(r) {
    if (!r || r.error || !r.access_token) {
      if (r && r.error && r.error !== 'popup_closed') showErr('Sign-in did not complete', 'Please try again.');
      return;
    }
    fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + r.access_token } })
      .then(function (x) { return x.json(); })
      .then(function (u) {
        var email = String(u.email || '').toLowerCase();
        if (!u.email_verified || ALLOWED.indexOf(email) < 0) {
          showErr('Log in not authorised', (email || 'This Google account') +
            ' is not approved for the List My India™ Founder Tracker. Please sign in with an approved account, or ask the founder for access.');
          if (google.accounts.oauth2.revoke) google.accounts.oauth2.revoke(r.access_token, function () {});
          return;
        }
        document.getElementById('err').style.display = 'none';
        document.getElementById('gate').style.display = 'none';
        var f = document.getElementById('app');
        f.src = TRACKER_URL + '?tok=' + encodeURIComponent(r.access_token) + '&authuser=' + encodeURIComponent(email);
        f.style.display = 'block';
      })
      .catch(function () { showErr('Sign-in did not complete', 'Please check your connection and try again.'); });
  }
  document.getElementById('gbtn').onclick = function () {
    if (!window.google || !google.accounts || !google.accounts.oauth2) { showErr('Still loading', 'Please wait a moment and click again.'); return; }
    if (!client) client = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: 'openid email profile', callback: onToken });
    client.requestAccessToken({ prompt: 'select_account' });   // always shows Google's account list
  };
  // The dashboard's Log out / Log in buttons send the whole page back here (your Google session is not touched).
  window.addEventListener('message', function (e) {
    if (/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin) && e.data && (e.data.lmiLogout || e.data.lmiReload)) location.reload();
  });
</script>
</body>
</html>
