<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Founder Tracker · List My India™</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--navy:#05132D;--yel:#FEEF22}
  html,body{margin:0;height:100%;background:#f4f6fb;font-family:Poppins,system-ui,sans-serif}
  .msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--navy);padding:16px}
  .msg .card{max-width:420px}
  .msg h2{margin:0 0 8px;font-size:20px}
  .msg p{font-size:14px;color:#445;line-height:1.5;margin:0 0 14px}
  button{font:600 14px Poppins,system-ui,sans-serif;border-radius:8px;padding:10px 18px;cursor:pointer;border:0;background:var(--yel);color:var(--navy)}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:transparent}
</style>
</head>
<body>
<div class="msg">
  <div class="card">
    <h2>Loading your dashboard…</h2>
    <p>If nothing appears, you're signed out or using a Google account that isn't approved. Log in with your approved account.</p>
    <button onclick="doLogin()">Log in</button>
  </div>
</div>
<iframe id="app" title="LMI Founder Tracker" allow="clipboard-write"></iframe>
<script>
  // Apps Script web-app URL (Deploy → Manage deployments → Web app URL)
  var TRACKER_URL = "https://script.google.com/macros/s/AKfycbzjXC80_FN2QAxQYtctQ2-pjDMoZ80_kZzorRVddG7HH8ZISQjhayIM3CflAX96zr52/exec";
  var frame = document.getElementById('app');
  function load() { frame.src = TRACKER_URL + '?t=' + Date.now(); }
  // The dashboard's own Log in / Log out buttons ask this page to reload it after Google sign-in/out.
  window.addEventListener('message', function (e) {
    if (/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin) && e.data && e.data.lmiReload) load();
  });
  function doLogin() {
    var w = window.open('https://accounts.google.com/AccountChooser?continue=' + encodeURIComponent('https://myaccount.google.com/'), 'lmi_auth', 'width=480,height=640');
    if (!w) return;
    var t = setInterval(function () { if (w.closed) { clearInterval(t); load(); } }, 700);
  }
  load();
</script>
</body>
</html>
