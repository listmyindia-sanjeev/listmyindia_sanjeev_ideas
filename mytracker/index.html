<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Founder Tracker · List My India™</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--blue:#0046BF;--navy:#05132D;--yel:#FEEF22}
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Poppins,system-ui,sans-serif;
       background:radial-gradient(circle at 50% 35%,#1d4fae 0%,var(--navy) 75%);color:#fff;padding:16px;box-sizing:border-box}
  .card{max-width:380px;width:100%;text-align:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);border-radius:18px;padding:32px 24px}
  h1{font-size:20px;margin:0 0 6px}h1 span{color:var(--yel)}
  p{font-size:14px;opacity:.85;line-height:1.5}
  a.btn{display:inline-block;margin-top:12px;background:var(--yel);color:var(--navy);text-decoration:none;font-weight:600;padding:12px 22px;border-radius:10px}
  .lock{font-size:12px;opacity:.6;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <h1>List My India<span>™</span> Founder Tracker</h1>
  <p>Opening the secure dashboard… You'll be asked to sign in with an approved Google account.</p>
  <a class="btn" id="go" href="#">Open tracker</a>
  <div class="lock">🔒 Access limited to approved founders · data stays in Google</div>
</div>
<script>
  // Paste the Apps Script web-app URL (Deploy → Manage deployments → Web app URL) below.
  var TRACKER_URL = "https://script.google.com/macros/s/AKfycbzjXC80_FN2QAxQYtctQ2-pjDMoZ80_kZzorRVddG7HH8ZISQjhayIM3CflAX96zr52/exec";
  var a = document.getElementById('go');
  if (TRACKER_URL.indexOf('https://script.google.com/') === 0) {
    a.href = TRACKER_URL;
    setTimeout(function () { window.location.replace(TRACKER_URL); }, 800);
  } else {
    a.textContent = 'Tracker URL not set yet';
  }
</script>
</body>
</html>
