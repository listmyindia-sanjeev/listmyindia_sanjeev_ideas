<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Founder Tracker · List My India™</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{--blue:#0046BF;--navy:#05132D;--yel:#FEEF22}
  html,body{margin:0;height:100%;font-family:Poppins,system-ui,sans-serif}
  body{background:radial-gradient(circle at 50% 35%,#1d4fae 0%,var(--navy) 75%)}
  #gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
  .card{width:100%;max-width:380px;text-align:center;background:#fff;border-radius:18px;padding:32px 24px;box-sizing:border-box;box-shadow:0 20px 50px rgba(0,0,0,.25)}
  h1{font-size:20px;margin:0 0 4px;color:var(--navy)}h1 span{color:var(--blue)}
  p{font-size:14px;color:#556;line-height:1.5;margin:0 0 20px}
  #gbtn{display:flex;justify-content:center;min-height:44px}
  #err{color:#C62828;font-size:13px;margin-top:14px;min-height:18px}
  .lock{font-size:12px;color:#889;margin-top:18px}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#f4f6fb}
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <h1>List My India<span>™</span> Founder Tracker</h1>
    <p>Sign in with your approved Google account to open the dashboard.</p>
    <div id="gbtn"></div>
    <div id="err"></div>
    <div class="lock">🔒 Approved founders only · data stays in Google</div>
  </div>
</div>
<iframe id="app" title="LMI Founder Tracker" allow="clipboard-write"></iframe>
<script>
  // Google sign-in client (Google Cloud project "LMI Tracker Sign-in", listmyindia@gmail.com) — allowed only on https://listmyindia.org
  var CLIENT_ID = "292504984896-gf0a1gck80o9bb91qleed9sao9s9u1pb.apps.googleusercontent.com";
  // Apps Script web-app URL (Deploy → Manage deployments → Web app URL)
  var TRACKER_URL = "https://script.google.com/macros/s/AKfycbzjXC80_FN2QAxQYtctQ2-pjDMoZ80_kZzorRVddG7HH8ZISQjhayIM3CflAX96zr52/exec";
  // Who may pass this screen (the dashboard itself also checks its own allow-list and the Sheet's sharing)
  var ALLOWED = ["listmyindia@gmail.com", "smile.sanjeev@gmail.com"];

  function claims(jwt) {
    var b = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
    return JSON.parse(decodeURIComponent(atob(b).split('').map(function (c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2); }).join('')));
  }
  function onSignIn(resp) {
    var c = claims(resp.credential), email = String(c.email || '').toLowerCase();
    if (c.aud !== CLIENT_ID || !c.email_verified || ALLOWED.indexOf(email) < 0) {
      document.getElementById('err').textContent = email + ' is not approved for the tracker.';
      return;
    }
    document.getElementById('gate').style.display = 'none';
    var f = document.getElementById('app');
    f.src = TRACKER_URL + '?authuser=' + encodeURIComponent(email) + '&t=' + Date.now();
    f.style.display = 'block';
  }
  window.onload = function () {
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onSignIn, auto_select: false, cancel_on_tap_outside: true });
    google.accounts.id.disableAutoSelect();   // never sign in silently — ask every time
    google.accounts.id.renderButton(document.getElementById('gbtn'),
      { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with', logo_alignment: 'left' });
  };
  // The dashboard's Log out / Log in buttons reload this page → back to this sign-in screen (your Google session is not touched).
  window.addEventListener('message', function (e) {
    if (/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin) && e.data && (e.data.lmiLogout || e.data.lmiReload)) location.reload();
  });
</script>
</body>
</html>
